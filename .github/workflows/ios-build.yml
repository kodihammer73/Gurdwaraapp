name: iOS Build & Publish

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
    paths:
      - 'gurdwara_app/lib/**'
      - 'gurdwara_app/ios/**'
      - 'gurdwara_app/pubspec.yaml'
      - 'gurdwara_app/pubspec.lock'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'gurdwara_app/lib/**'
      - 'gurdwara_app/ios/**'
      - 'gurdwara_app/pubspec.yaml'
      - 'gurdwara_app/pubspec.lock'
      - '.github/workflows/ios-build.yml'


jobs:
  build-and-publish-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: gurdwara_app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Run tests
      run: flutter test
      continue-on-error: true

    - name: Cache CocoaPods
      uses: actions/cache@v3
      with:
        path: gurdwara_app/ios/Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('gurdwara_app/ios/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Install CocoaPods
      run: |
        cd ios
        pod install
      shell: bash

    - name: Import signing certificate
      env:
        APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
        APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
      run: |
        CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        echo "$APPLE_DIST_P12" | base64 --decode > "$CERT_PATH"
        security create-keychain -p "" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$APPLE_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
      shell: bash

    - name: Install provisioning profile
      env:
        APPLE_DIST_PROFILE: ${{ secrets.APPLE_DIST_PROFILE }}
      run: |
        PROFILE_PATH="$RUNNER_TEMP/distribution.mobileprovision"
        echo "$APPLE_DIST_PROFILE" | base64 --decode > "$PROFILE_PATH"
        security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/distribution.plist"
        UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/distribution.plist")
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
        echo "Installed provisioning profile UUID: $UUID"
      shell: bash

    - name: Build unsigned iOS app
      run: flutter build ios --release --no-codesign

    - name: Sign app & create IPA
      run: |
        set -euo pipefail
        cd build/ios/iphoneos
        # Minimal entitlements: aps-environment enables push notifications in the store build
        cat > "$RUNNER_TEMP/entitlements.plist" <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>aps-environment</key>
            <string>production</string>
        </dict>
        </plist>
        EOF
        # Codesign the whole .app (deep signs the nested frameworks) with the iPhone Distribution cert
        /usr/bin/codesign --force --deep --sign "iPhone Distribution" \
          --entitlements "$RUNNER_TEMP/entitlements.plist" Runner.app
        codesign -dv --verbose=4 Runner.app 2>&1 | sed -n '1,15p'
        # Package into an .ipa (Payload/Runner.app)
        rm -rf Payload
        mkdir -p Payload
        mv Runner.app Payload/
        zip -r -y "${{ github.workspace }}/gurdwara_app.ipa" Payload/
      shell: bash

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-signed-ipa
        path: gurdwara_app.ipa

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: gurdwara_app.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to App Store Connect
      if: startsWith(github.ref, 'refs/tags/')
      env:
        API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        API_KEY_FILE: ${{ secrets.APPLE_API_KEY_FILE }}
      run: |
        mkdir -p "$HOME/private_keys"
        echo "$API_KEY_FILE" | base64 --decode > "$HOME/private_keys/AuthKey_$API_KEY.p8"
        xcrun altool --upload-app -f "${{ github.workspace }}/gurdwara_app.ipa" -t ios \
          --apiKey "$API_KEY" --apiIssuer "$API_ISSUER" --verbose
      shell: bash
