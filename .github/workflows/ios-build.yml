name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-ios:
    runs-on: macos-latest
    
    defaults:
      run:
        working-directory: gurdwara_app
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Run tests
      run: flutter test
      continue-on-error: true
    
    - name: Cache CocoaPods
      uses: actions/cache@v3
      with:
        path: gurdwara_app/ios/Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('gurdwara_app/ios/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-
    
    - name: Install CocoaPods
      run: |
        cd ios
        pod install
      shell: bash
    
    - name: Build iOS IPA
      run: flutter build ios --release --no-codesign
    
    - name: Create IPA
      run: |
        cd build/ios/iphoneos
        mkdir -p Payload
        mv Runner.app Payload/
        zip -r -y ${{ github.workspace }}/gurdwara_app.ipa Payload/
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: gurdwara_app.ipa
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: gurdwara_app.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
